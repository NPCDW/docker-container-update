[package]
name = "docker-container-update"
version = "0.1.0"
edition = "2021"
# 依赖（clap 4.6 / indexmap 2）要求 1.85+
rust-version = "1.85"
description = "扫描指定目录下的 docker-compose 文件，并对容器执行更新"
license = "MIT"

[[bin]]
name = "docker-container-update"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
