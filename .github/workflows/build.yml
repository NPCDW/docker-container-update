name: Build

on:
  push:
    tags: "*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            archive-name: docker-container-update-${{ github.ref_name }}-linux-amd64.tar.gz
          - build: linux-arm
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            archive-name: docker-container-update-${{ github.ref_name }}-linux-arm64.tar.gz
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        target: ${{ matrix.rust_target }}
    - name: Build
      run: cargo build --verbose --release --target ${{ matrix.rust_target }}
      env:
        RUST_BACKTRACE: 1
    - name: Strip binary (linux and macos)
      if: matrix.build == 'linux' || matrix.build == 'macos'
      run: strip "target/${{ matrix.rust_target }}/release/docker-container-update"
    - name: Build archive
      shell: bash
      run: |
        mkdir archive
        cp LICENSE README.md archive/
        cd archive
        cp "../target/${{ matrix.rust_target }}/release/docker-container-update" ./
        tar -czf "${{ matrix.archive-name }}" LICENSE README.md docker-container-update
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: archive/${{ matrix.archive-name }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            npcdw/docker-container-update:${{ github.ref_name }}
            npcdw/docker-container-update:latest